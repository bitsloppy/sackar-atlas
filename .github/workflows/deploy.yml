name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly at 2am UTC (noon AEST)
  workflow_dispatch:     # manual trigger via GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy to Cloudflare Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          ZOTERO_GROUP_ID: ${{ secrets.ZOTERO_GROUP_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: bash build.sh

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 00803d87a089dac92b0234ae0af5a9a8
        run: |
          # Remove wrangler state created by the adapter during build
          # (conflicts with the wrangler.json in dist/server/)
          rm -rf site/.wrangler/
          cd site/dist/server
          # Strip the SESSION KV binding — we don't use Astro sessions and
          # the API token doesn't need KV permissions.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('wrangler.json'));
            c.kv_namespaces = [];
            if (c.previews) c.previews.kv_namespaces = [];
            c.vars = {
              PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: 'sackar-atlas-cms',
              KEYSTATIC_GITHUB_CLIENT_ID: 'Iv23liEzLlXB3JL9B5wN',
            };
            fs.writeFileSync('wrangler.json', JSON.stringify(c));
          "
          npx wrangler deploy --name sackar-atlas --compatibility-flags nodejs_compat
          echo "${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}" | npx wrangler secret put KEYSTATIC_GITHUB_CLIENT_SECRET --name sackar-atlas
          echo "${{ secrets.KEYSTATIC_SECRET }}" | npx wrangler secret put KEYSTATIC_SECRET --name sackar-atlas
